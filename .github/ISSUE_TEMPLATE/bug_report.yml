name: Bug report
description: Something doesn't work the way it should.
labels: ["bug", "needs-review"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Which app you were in, what you selected, which keys you pressed.
      placeholder: |
        1. Open Notepad and select the word "bank"
        2. Press Ctrl+Alt+D
        3. ...
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: The last lines of %APPDATA%\VerbaLogic\verbalogic.log. It can contain text you looked up, so remove anything private first.
      render: text
